name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Prepare site
        run: |
          set -euo pipefail
          SITE=dist/client
          test -d "$SITE"
          mkdir -p _site
          cp -a "$SITE"/. _site/
          touch _site/.nojekyll
          if [ ! -s _site/index.html ] && [ -f _site/_shell.html ]; then
            cp _site/_shell.html _site/index.html
          fi
          cp _site/index.html _site/404.html
          test -s _site/index.html
          test -d _site/assets
          test -d _site/templates
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
